services:
  web:
    build:
      context: .
      args:
        PUBLIC_API_ON_DEMAND_URL: ${PUBLIC_API_ON_DEMAND_URL}
        PUBLIC_API_SPORTS_URL: ${PUBLIC_API_SPORTS_URL}
        PUBLIC_PLANS_API_URL: ${PUBLIC_PLANS_API_URL}
    environment:
      # Runtime (no build): nginx las sustituye por envsubst. NO se hornean en el cliente.
      # LEADS_API_KEY debe ser IGUAL a la del backend Next. LEADS_UPSTREAM incluye /api/leads.
      # El :? aborta `docker compose up` si faltan, dejando el contenedor viejo corriendo,
      # en vez de arrancar un nginx roto y tirar el sitio (503 de Apache).
      LEADS_API_KEY: ${LEADS_API_KEY:?falta LEADS_API_KEY en el .env}
      LEADS_UPSTREAM: ${LEADS_UPSTREAM:?falta LEADS_UPSTREAM en el .env (URL completa con /api/leads)}
    ports:
      - "4321:80"
    restart: unless-stopped
