server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets emitted by Astro — cache forever
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed files from public/ (logos, favicon, images)
    location ~* \.(png|webp|svg|ico)$ {
        expires 7d;
    }

    # HTML — always revalidate so deploys take effect immediately (keeps bfcache/304s working)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
