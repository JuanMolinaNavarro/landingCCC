# Este archivo se copia a /etc/nginx/templates/default.conf.template en el
# Dockerfile. La imagen oficial de nginx corre `envsubst` al arrancar y
# sustituye ${LEADS_API_KEY} y ${LEADS_UPSTREAM} desde el entorno del
# contenedor (definidas en docker-compose.yml -> environment), generando
# /etc/nginx/conf.d/default.conf. Las variables de nginx ($uri, $host, etc.)
# NO se tocan: envsubst solo reemplaza las que existen en el entorno.

# Rate limiting del formulario de ventas: ~6 req/min por IP.
limit_req_zone $binary_remote_addr zone=leads:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Proxy del formulario de ventas -------------------------------------
    # El navegador postea acá (mismo origen, SIN api-key). nginx agrega la
    # X-Api-Key del lado servidor y reenvia al backend. La clave nunca llega
    # al cliente.
    # OJO: la ruta NO empieza con /api/ a propósito. El Apache de adelante
    # proxea /api/* directo al backend (salteando este nginx), asi que esta
    # ruta tiene que caer en el catch-all que Apache manda al contenedor.
    location = /enviar-lead {
        limit_except POST { deny all; }
        limit_req zone=leads burst=3 nodelay;

        proxy_pass ${LEADS_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_set_header X-Api-Key "${LEADS_API_KEY}";

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Hashed assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — never cache so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
